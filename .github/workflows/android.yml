name: Android CI & APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22 (Required by Capacitor 8 CLI)
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Application Bundle
      run: npm run build

    - name: Sync Capacitor Native Project
      run: npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android SDK Licenses
      run: yes | sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: |
        chmod +x android/gradlew || true
        chmod +x gradlew || true

    - name: Build Debug APK with Gradle
      working-directory: android
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload Native Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zanna-ai-android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
